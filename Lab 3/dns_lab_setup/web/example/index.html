<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>example.com - Lab Demonstration</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 48px auto; line-height: 1.5; }
    table { border-collapse: collapse; width: 100%; max-width: 520px; }
    th, td { border: 1px solid #999; padding: 10px; text-align: left; }
    input { width: 95%; padding: 6px; }
    button { padding: 7px 16px; }
    .note { margin-top: 18px; color: #444; }

</head>
<body>
  <h1>example.com Lab Demonstration</h1>
  <p>This is the lab-controlled example.com website on server 10.11.2.8.</p>

  <form action="#" method="get" onsubmit="return false;">
    <table>
      <tr><th colspan="2">Demonstration Login</th></tr>
      <tr><td>Username</td><td><input type="text" name="username" autocomplete="off"></td></tr>
      <tr><td>Password</td><td><input type="password" name="password" autocomplete="off"></td></tr>
      <tr><td colspan="2"><button type="submit">Login</button></td></tr>
    </table>

  <p class="note">Static classroom page only. The form does not submit, store, or process credentials.</p>
