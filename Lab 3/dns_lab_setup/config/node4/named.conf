include "/etc/bind/rndc.key";

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    listen-on port 53 { 127.0.0.1; 10.11.2.8; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    minimal-responses no;
};

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys { "rndc-key"; };
};

zone "attackerpage.com" IN {
    type primary;
    file "/etc/bind/db.attackerpage.com";
    allow-query { any; };
};

zone "example.com" IN {
    type primary;
    file "/etc/bind/db.example.com";
    allow-query { any; };
};
