include "/etc/bind/rndc.key";

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    dump-file "/var/cache/bind/cache_dump.db";

    listen-on port 53 { 127.0.0.1; 10.11.2.6; };
    listen-on-v6 { none; };

    // Closed recursive resolver: recursion is available only to this lab subnet.
    recursion yes;
    allow-query { 127.0.0.1; 10.11.2.0/24; };
    allow-recursion { 127.0.0.1; 10.11.2.0/24; };
    allow-query-cache { 127.0.0.1; 10.11.2.0/24; };

    // No global forwarders. BIND uses its built-in root hints and performs
    // normal iterative resolution through the DNS hierarchy.

    // SEED-style teaching setting. Current BIND accepts a fixed UDP
    // query-source port, although this weakens source-port randomization.
    query-source address * port 12345;
    query-source-v6 none;

    include "/etc/bind/lab-dnssec.conf";

    minimal-responses no;
    empty-zones-enable yes;
};

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys { "rndc-key"; };
};

// Only the lab nameserver-discovery zone is routed to node4.
// IMPORTANT: example.com is NOT overridden here. A normal query for
// example.com therefore follows the real public DNS hierarchy.
zone "attackerpage.com" IN {
    type forward;
    forward only;
    forwarders { 10.11.2.8; };
};
